<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#153653">
<meta name="description" content="IBC Digital : identification et suivi des enfants sans acte de naissance.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>IBC Digital</title>

<script src="exceljs.min.js"></script>
<style>
:root{--navy:#1b3d5c;--blue:#3479b0;--sky:#a8dbe8;--paper:#f8f9fb;--ink:#17202a;--mute:#6b7785;--line:#3a4552;--warn:#e8643a;--bad:#b3261e;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121a23;--ink:#e8eef4;--mute:#97a4b2;--line:#8fa0b2;--card:#1a2531}}
:root[data-theme="dark"]{--paper:#121a23;--ink:#e8eef4;--mute:#97a4b2;--line:#8fa0b2;--card:#1a2531}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--navy);color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100%;background:var(--paper);position:relative;overflow-x:hidden}
.hero{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;padding:18px 18px 26px 120px;border-bottom-left-radius:0;border-bottom-right-radius:60px;position:relative;min-height:150px}
.logo{position:absolute;left:14px;top:14px;width:92px;height:92px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font:italic 800 30px/1 Georgia,serif}
.logo small{font:600 11px sans-serif;display:block;text-align:right;margin-top:-2px}
.hero h1{margin:6px 0 4px;font-size:30px;font-style:italic;font-weight:700}
.hero p{margin:0;font-size:13px;font-style:italic;opacity:.92}
.hero p b{font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.bar{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;padding:14px 16px 52px;border-bottom-left-radius:40px}
.bar .row{display:flex;align-items:center;justify-content:space-between}
.bar h2{margin:0;font-size:24px;font-style:italic}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px}
.grp{font-size:13px;color:#8ff0e8;margin-top:8px}.grp b{font-size:20px;color:#fff;font-style:italic}
.tag{position:absolute;right:12px;margin-top:-30px;background:#fff;color:var(--blue);border-radius:22px;padding:10px 18px;font-weight:600;font-style:italic;box-shadow:0 2px 8px #0003}
.idb{position:absolute;right:20px;margin-top:-4px;background:var(--navy);color:#8ff0e8;border-radius:18px;padding:5px 16px;font-size:13px;font-style:italic;z-index:2}
.sub{text-align:center;font-weight:700;font-style:italic;font-size:19px;margin:-30px 0 10px;position:relative}
.menu{padding:26px 14px 10px;display:flex;flex-direction:column;gap:18px}
.pill{border:2px solid var(--sky);background:var(--card);color:var(--ink);border-radius:40px;padding:16px 20px;font:italic 700 18px inherit;font-family:inherit;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 2px 8px #0001;text-align:left}
.pill.main{background:#e4e6ea;color:#17202a}
.menu .r{display:flex;gap:12px}.menu .r .pill:first-child{flex:1}
.link{color:#1a1adb;font:italic 700 18px inherit;font-family:inherit;background:var(--card);border:0;border-radius:20px;padding:10px 16px;text-align:left;width:fit-content;cursor:pointer}
.note{padding:6px 24px;font-size:15px;line-height:1.7;color:var(--mute);font-style:italic}.note b{color:var(--warn)}
.google{margin:10px 14px;border:0;background:var(--card);border-radius:40px;padding:16px;font:italic 700 19px inherit;font-family:inherit;color:var(--ink);box-shadow:0 0 0 8px #a8dbe855,0 2px 8px #0002;width:calc(100% - 28px);cursor:pointer}
.f{position:relative;margin:20px 16px 4px}
.f label{position:absolute;top:-10px;left:22px;background:var(--paper);padding:0 8px;font:italic 15px Georgia,serif;color:var(--mute)}
.f input,.f select{width:100%;border:1.5px solid var(--line);border-radius:30px;background:transparent;color:var(--ink);padding:16px 20px;font:20px Georgia,serif;min-height:56px}
.f input:focus,.f select:focus{outline:3px solid var(--blue);outline-offset:1px}
.f.err input,.f.err select{border-color:var(--bad)}
.h{margin:2px 28px 0;font:italic 15px Georgia,serif;color:var(--mute)}.h i{color:var(--warn);font-style:normal;font-size:18px}.f.err+.h{color:var(--bad)}
.dt{display:flex;align-items:center;gap:8px}.dt input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy);min-height:0;padding:0}
.dt span{font-size:14px;white-space:nowrap}
.sx{display:flex;align-items:center;gap:14px;margin:22px 20px 10px;font-size:20px}.sx label{display:flex;align-items:center;gap:6px;font-style:italic}
.sx input{width:24px;height:24px;accent-color:var(--blue)}
.nav{display:flex;align-items:center;margin:26px 14px 30px;gap:0}
.back{width:74px;height:74px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;z-index:1;cursor:pointer}.back:disabled{background:#d6d6d6}
.next{flex:1;margin-left:-8px;height:44px;border:0;border-radius:0 30px 30px 0;background:var(--blue);color:#fff;font:italic 22px inherit;font-family:inherit;cursor:pointer}
.next.save{background:var(--navy)}
.dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--paper);width:100%;max-width:440px;border-radius:30px;padding:22px 8px 20px;max-height:90%;overflow:auto}
.box p{margin:0 20px 8px;font:italic 19px/1.6 Georgia,serif;color:var(--mute)}
.btns{display:flex;gap:16px;justify-content:center;margin-top:22px}
.btns button{border-radius:30px;border:2px solid var(--blue);background:var(--card);color:var(--blue);font:italic 700 20px inherit;font-family:inherit;padding:14px 26px;cursor:pointer}.btns .no{border-color:var(--bad);color:var(--bad)}
.item{margin:10px 14px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 6px #0002}
.item b{font-size:17px}.item small{display:block;color:var(--mute);margin-top:3px}
.dup{color:var(--bad);font-weight:700;font-size:13px}
.item button{border:0;background:none;color:var(--bad);font-size:14px;padding:6px 0;cursor:pointer}
.stat{display:flex;gap:10px;margin:-30px 14px 8px;position:relative}.stat div{flex:1;background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 1px 6px #0002}.stat b{font-size:24px;display:block;color:var(--blue)}.stat small{color:var(--mute)}
.srch{margin:14px 16px 4px}.srch input{width:100%;border:1.5px solid var(--line);border-radius:30px;background:transparent;color:var(--ink);padding:14px 20px;font-size:17px}
.empty{text-align:center;color:var(--mute);padding:40px 30px;font-style:italic;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:24px;z-index:12;max-width:90%;text-align:center}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid #0002;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 12px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;cursor:pointer}.tabs button span{font-size:20px}.tabs .on{color:var(--blue);background:#3479b022}

/* IBC Digital — couche d'amélioration visuelle, sans modifier les fonctions métier */
:root{--navy:#153653;--blue:#286fa8;--sky:#b7dce9;--paper:#f4f7fb;--ink:#182635;--mute:#667789;--line:#c6d1dc;--warn:#c65b32;--bad:#b3261e;--card:#fff;--accent:#19a99a;--soft:#e9f2f8;--shadow:0 8px 24px rgba(20,48,73,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101923;--ink:#e9f0f6;--mute:#a6b4c2;--line:#425466;--card:#192633;--soft:#203749;--shadow:0 8px 24px rgba(0,0,0,.18)}}
:root[data-theme="dark"]{--paper:#101923;--ink:#e9f0f6;--mute:#a6b4c2;--line:#425466;--card:#192633;--soft:#203749;--shadow:0 8px 24px rgba(0,0,0,.18)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh;background:linear-gradient(145deg,#102c45 0%,#286fa8 100%);padding:0 12px}
#app{max-width:500px;min-height:100dvh;box-shadow:0 0 42px rgba(0,0,0,.16);padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{padding:22px 18px 28px 126px;min-height:154px;border-bottom-right-radius:42px;background:linear-gradient(145deg,#153653 0%,#286fa8 70%,#3291b2 100%);box-shadow:0 6px 18px rgba(21,54,83,.16)}
.hero h1{font-size:clamp(23px,6vw,30px);letter-spacing:-.5px;line-height:1.12;margin:8px 0 7px}
.hero p{font-size:12px;line-height:1.5;max-width:250px}
.logo{left:16px;top:18px;width:94px!important;height:94px!important;border:3px solid rgba(255,255,255,.8);box-shadow:0 5px 18px #061b2b55!important}
.bar{background:linear-gradient(145deg,#153653,#286fa8 78%,#3291b2);padding:18px 16px 48px;border-bottom-left-radius:30px}
.bar h2{font-size:23px;letter-spacing:-.3px}
.menu{padding:24px 16px 12px;gap:13px}
.pill,.link,.google,.next,.back,.ib,.btns button,.tabs button,.item button{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease}
.pill{min-height:56px;border:1px solid #c6dce8;background:var(--card);border-radius:18px;padding:15px 18px;font-size:16px;font-weight:650;font-style:normal;line-height:1.35;box-shadow:0 3px 10px rgba(18,54,82,.055)}
.pill.main{background:linear-gradient(135deg,#1b496d,#286fa8);border-color:transparent;color:#fff;box-shadow:0 6px 15px rgba(40,111,168,.2)}
.pill:hover,.google:hover{box-shadow:0 7px 18px rgba(18,54,82,.13);transform:translateY(-1px)}
.pill:active,.google:active,.next:active,.back:active{transform:scale(.985)}
.link{font-size:15px;font-style:normal;color:var(--blue)}
.note{font-size:14px;line-height:1.65;font-style:normal;padding:8px 22px}
.note b{color:var(--blue)}
.google{border:1px solid var(--line);border-radius:16px;padding:15px 18px;font-size:16px;font-style:normal;font-weight:650;box-shadow:var(--shadow);margin:14px 16px;width:calc(100% - 32px)}
.f{margin:24px 16px 8px}
.f label{font-size:13px;font-style:normal;font-weight:600;letter-spacing:.1px;top:-9px;color:var(--mute)}
.f input,.f select{border:1.5px solid var(--line);border-radius:15px;padding:15px 17px;min-height:54px;font:17px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;background:var(--card)}
.f input:focus,.f select:focus,.srch input:focus{outline:3px solid #3479b044;border-color:var(--blue)}
.h{font:13px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;margin:4px 22px;color:var(--mute)}
.sx{font-size:16px;gap:18px;margin:22px 20px 12px}
.sx label{font-style:normal}
.dt span{white-space:normal}
.nav{margin:24px 16px 32px}
.back{width:58px;height:58px;font-size:25px;flex:0 0 58px}
.next{height:48px;font-size:17px;font-weight:650;font-style:normal;margin-left:-5px;border-radius:0 15px 15px 0}
.dlg{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.box{border:1px solid var(--line);border-radius:24px;padding:22px 12px;box-shadow:0 18px 55px #0003}
.box p{font:16px/1.55 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink)}
.btns{gap:10px;flex-wrap:wrap}
.btns button{font:600 15px "Segoe UI",Roboto,system-ui,sans-serif;padding:13px 20px;border-radius:14px}
.item{margin:10px 14px;background:var(--card);border:1px solid rgba(120,150,175,.18);border-radius:18px;padding:15px 16px;box-shadow:0 4px 14px rgba(20,48,73,.045)}
.item b{line-height:1.4}
.item small{font-size:12px;line-height:1.55}
.stat{gap:8px;margin:-27px 14px 12px}
.stat div{border:1px solid rgba(120,150,175,.16);border-radius:16px;padding:12px 7px;box-shadow:0 5px 16px rgba(20,48,73,.07)}
.stat b{font-size:23px;line-height:1.25}
.stat small{font-size:11px;line-height:1.4;display:block;margin-top:3px}
.srch{margin:16px 16px 8px}
.srch input{border-radius:14px;background:var(--card);font-size:15px;padding:14px 16px}
.empty{font-size:14px;padding:34px 26px}
.tabs{max-width:500px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -5px 18px rgba(16,38,57,.07);border-top:1px solid rgba(100,130,155,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{border-radius:13px;padding:7px 4px;font-size:11px;min-height:48px}
.tabs button span{font-size:20px;line-height:1.2}
.tabs .on{color:var(--blue);background:var(--soft);font-weight:750}
.toast{border-radius:14px;box-shadow:0 8px 28px #0003;font-size:14px;line-height:1.4;padding:13px 18px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,label[role="button"],.item[role="button"]{-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex="0"]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3291b2;outline-offset:3px}
[disabled],button:disabled{opacity:.55;cursor:not-allowed}
@media(min-width:700px){body{padding:22px 12px}#app{min-height:calc(100dvh - 44px);border-radius:24px;overflow:hidden}.tabs{bottom:22px;border-radius:0 0 24px 24px}.toast{bottom:calc(52px + env(safe-area-inset-bottom,0px))}}
@media(max-width:360px){body{padding:0}.hero{padding-left:108px;padding-right:12px}.logo{width:82px!important;height:82px!important;left:12px;top:18px}.hero h1{font-size:23px}.hero p{font-size:11px}.menu{padding-left:12px;padding-right:12px}.pill{padding:13px 14px;font-size:15px}.stat{gap:5px}.stat b{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
